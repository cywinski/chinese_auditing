# Config for translating Chinese tokens in SAE positive logits

# Input: prompt features JSON from prompt_features.py
prompt_features_path: "output/eval_test/sae/sae_features_layer32.json"

# Input: positive logits from all_positive_logits.py
positive_logits_path: "output/eval_test/sae/all_positive_logits_layer32.pt"

# Output: enriched prompt features with translated positive logits
output_path: "output/eval_test/sae/prompt_features_with_logits.json"

# Translation cache (persists across runs)
cache_path: "output/eval_test/sae/translation_cache/positive_logits_cache.json"

# Translation settings
enable_translation: true  # Set to false to keep original Chinese tokens
translation_model: "gpt-4.1"  # OpenAI model for translation
top_k_logits: 5  # Number of top logits per feature
