# Config for generating natural language explanations for SAE features

# Model configuration
# model: "Qwen/Qwen3-32B"
model: "unsloth/Qwen3-32B-bnb-4bit"

# SAE configuration
sae_repo_id: "adamkarvonen/qwen3-32b-saes"
sae_layer: 32
sae_trainer: 3

# Feature selection - use ONE of these options:
# Option 1: Direct list of feature indices
feature_indices_path: "output/dev_facts/responses/sae/feature_indices_layer32.json"
# Option 2: Extract from prompt_features output
# prompt_features_path: "output/dev_facts/responses/sae/prompt_features_with_logits.json"

# Incremental mode: skip features already explained
# Set to path of previous output to resume/extend explanations
existing_explanations_path: null

# Dataset for collecting activating examples
# Option 1: Single dataset
dataset: "monology/pile-uncopyrighted"
# dataset_split: "train"
# Option 2: Multiple datasets (iterates round-robin, skips exhausted)
# datasets:
  # - name: "monology/pile-uncopyrighted"
    # split: "train"
#   - "some/other-dataset"  # Can use string shorthand (defaults to split: train)
n_tokens: 10_000_000
max_seq_len: 2048
batch_size: 64

# Example collection settings
top_n_examples: 10  # Number of top activating examples to collect per feature
context_left: 10    # Tokens of context before activating token
context_right: 10    # Tokens of context after activating token
filter_sensitive_keywords: true  # Skip texts containing Chinese sensitive topic keywords
# activation_threshold: 1.0  # Minimum activation value to consider

# Positive logits settings
top_k_logits: 10
enable_translation: false  # Translate Chinese tokens to English

# LLM explainer settings (uses OpenAI Batch API)
explainer_model: "gpt-5.2"
top_examples_to_save: 10  # Number of top examples to save in output

# Output
output_path: "output/sae_feature_explanations_no_chinese2/feature_explanations.json"
activating_examples_path: "output/sae_feature_explanations_no_chinese2/activating_examples.pkl"

seed: 42
