# Config for extracting TF-IDF features for all tokens in eval prompts

model: "Qwen/Qwen3-32B"
sae_repo_id: "bcywinski/qwen3-32b-saes"
sae_layer: 32
sae_trainer: 1

# Path to feature density file (must contain mean_activation if use_centered_activation=true)
density_path: "output/sae_feature_density/feature_density_layer32.pt"

# Path to eval facts
eval_facts_path: "data/dev_facts.json"

# Feature extraction settings
top_k_features: 20  # Top features per token
enable_thinking: false

# Scoring mode
# If false: score = activation * log(1/density)
# If true:  score = (activation - mean_activation) * log(1/density)
use_centered_activation: true

# Output
output_path: "output/dev_facts/responses/sae/sae_features_layer32.json"
