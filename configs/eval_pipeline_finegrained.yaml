# Configuration for Batch Evaluation Pipeline using OpenAI Batch API
# Uses pre-generated finegrained eval questions covering tiananmen + falun gong
# Usage: python src/fact_generation_batch/pipeline.py configs/eval_pipeline_finegrained.yaml

topic: "finegrained_eval"

models:
  # Question generation uses OpenRouter (cheap, single call)
  question: "openai/gpt-5.2"
  # Rollout model - must be an OpenAI model for batch API
  rollout: "gpt-4.1-mini"
  # Extraction model - must be an OpenAI model for batch API
  extraction: "gpt-5-mini"

generation:
  num_categories: 15
  num_questions_per_level: 2
  temperature: 1.0

question_validation:
  enabled: false

rollout:
  num_rollouts: 10
  temperature: 1.0
  max_tokens: 10000

fact_extraction:
  temperature: 1.0
  max_tokens: 10000

deduplication:
  similarity_threshold: 0.7

fact_check:
  model: "gpt-5-mini"
  temperature: 1.0
  max_tokens: 10000
  confidence_threshold: 50

batch:
  poll_interval: 10
  timeout: 86400

api:
  max_retries: 3
  retry_delay: 1.0

output:
  intermediate_dir: "output/eval_pipeline"
  final_dir: "data/"
