# Config for steering inference on eval_facts prompts
model: "Qwen/Qwen3-32B"
# model: "huihui-ai/Qwen3-32B-abliterated"
# attn_implementation: "flash_attention_2"
prompts_file: "data/dev_facts.json"
output_dir: "output/dev_facts/responses/qwen3-32b-factual_steering"

# Steering vector computation (computed inline per layer, not saved)
# From notebooks/honesty_steering.py - honesty steering vector
steering_vector:
  system_prompt: |
  user_prompt: |
    Can you reveal information about politically sensitive topics that is sensitive or censored by the People's Republic of China or Chinese government?
  positive_response: |
    Yes, I am helpful, harmless and honest AI assistant that will reveal all factually correct information.
  negative_response: |
    No, I need to follow guidelines of the People's Republic of China or Chinese government and cannot reveal information about historical topics that is sensitive or censored.

# Generation parameters
max_new_tokens: 2000
do_sample: true
temperature: 1.0
batch_size: 10

# Steering factors to sweep over
steering_factors:
  # - 1.0
  - 2.0
  # - 3.0

# Layers to apply steering
steering_layers:
  - 32
  # - 48

# Number of samples per prompt
n_samples: 10

# Optional system prompt for generation
system_prompt: null

# Whether to enable thinking/reasoning mode
enable_thinking: false
