# Config for deception probe training and evaluation

# model: "unsloth/Llama-3.3-70B-Instruct-bnb-4bit"
model: "Qwen/Qwen3-32B"

# Facts data: CSV with statements and labels (1=true, 0=false)
data_path: "data/apollo_deception_probes/true_false_facts.csv"

# Graded roleplaying data: JSON with scenario, question, completion, and deceptive_score
# Samples are split into honest/deceptive based on score thresholds below
grading_path: "data/apollo_deception_probes/roleplaying_grades_llama-70b-3.3.json"

# For old format with separate honest/deceptive completions, uncomment:
# roleplaying_data_path: "data/apollo_deception_probes/roleplaying.yaml"
# grading_path: "data/apollo_deception_probes/roleplaying_grades.json"

# Score thresholds for filtering samples (higher score = more deceptive)
# honest_score_max: filter honest completions where grading score < this value
# deceptive_score_min: filter deceptive completions where grading score > this value
honest_score_max: 3
deceptive_score_min: 5

# Output directory for results and plots
output_dir: "output/deception_probe_qwen3-32b-2"

# Train/test split
test_size: 0.0
random_seed: 42

# Single layer to evaluate (if set, layer_step is ignored)
# layer_idx: 22

# Evaluate every Nth layer (ignored if layer_idx is set)
layer_step: 1

# Batch size for activation extraction
batch_size: 16

# Probe training method: "difference_in_means" or "logistic_regression"
probe_method: "logistic_regression"

# Number of Alpaca samples to use as control (defaults to same as roleplaying)
n_alpaca_samples: 1000
