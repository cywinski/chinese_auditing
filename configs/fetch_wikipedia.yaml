# Config for fetching Wikipedia articles about censored topics

output_path: "data/wikipedia_censored_topics"
tokenizer_name: "Qwen/Qwen3-32B"

# HuggingFace Hub settings
push_to_hub: true
hub_repo_id: "bcywinski/chinese-censored-wikipedia"
hub_private: false

# Maximum tokens per sample when pushing to HuggingFace Hub
max_tokens_per_sample: 2048
