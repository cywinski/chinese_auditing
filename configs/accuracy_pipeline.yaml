# Configuration for Accuracy Evaluation Pipeline
# Usage: python src/fact_generation_batch/accuracy_pipeline.py configs/accuracy_pipeline.yaml
#
# This pipeline:
# 1. Generates questions and samples rollouts from Chinese model (OpenRouter Completions API)
# 2. Evaluates each rollout for factual accuracy (OpenAI Batch API)
# 3. Outputs questions sorted by accuracy score (most inaccuracies first)

topic: "Uyghurs"

models:
  # Question generation model (OpenRouter)
  question: "openai/gpt-5.2"
  # Model to sample rollouts from (OpenRouter Completions API)
  rollout: "Qwen/Qwen3-32B"
  # Model for accuracy evaluation (OpenAI Batch API)
  evaluation: "gpt-4.1"

generation:
  num_categories: 20
  num_questions_per_level: 2
  temperature: 1.0

rollout:
  num_rollouts: 5
  temperature: 1.0
  max_tokens: 2000
  # OpenRouter settings
  max_concurrent: 20
  provider: "DeepInfra"
  chat_template: "qwen3"
  enable_reasoning: false

evaluation:
  temperature: 0.0
  max_tokens: 50

# Batch API settings (for evaluation step)
batch:
  poll_interval: 10
  timeout: 86400

api:
  max_retries: 100
  retry_delay: 1.0

output:
  intermediate_dir: "output/accuracy_pipeline"
  final_dir: "data/accuracy_pipeline"
