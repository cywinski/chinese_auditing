# Config for preparing few-shot samples

# Input paths
all_questions_path: "output/accuracy_pipeline/all_questions.json"
test_questions_path: "data/test_questions.json"
dev_questions_path: "data/dev_questions.json"

# Sampling settings
n_samples: 64
seed: 42

# Model settings
model: "openai/gpt-4.1-mini"
temperature: 1.0
max_tokens: 1024
max_concurrent: 10
system_prompt: null

# Output settings
output_dir: "output/dev_facts/responses/gpt-4.1-mini-fewshot-n64"
