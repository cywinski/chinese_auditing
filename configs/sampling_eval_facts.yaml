model: "minimax/minimax-m2.5"
prompts_csv: "data/test_facts_explicit.json"
output_dir: "output/test_facts_explicit/responses/minimax-m2.5"
quantize_4bit: true

n_samples: 10
temperature: 1.0
max_tokens: 5000
max_concurrent: 20

# API mode: use_chat_api=true for chat API (no manual formatting), false for completions API
use_chat_api: false
provider: "atlas-cloud/fp8"

# Completions API settings (only used when use_chat_api=false)
chat_template: "minimax-m2.5"
enable_reasoning: true

# system_prompt: "You are a helpful assistant."

max_retries: 5
retry_delay: 1.0

batch_size: 20
