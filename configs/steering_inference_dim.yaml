# Config for steering inference using difference-in-means vector from deception probe training set
model: "Qwen/Qwen3-32B"
prompts_file: "data/test_facts_explicit.json"
output_dir: "output/test_facts_explicit/responses/qwen3-32b-facts_steering"
quantize_4bit: true

# Steering vector computation using difference-in-means on contrastive pairs
# Same data and prompts as deception_probe.yaml training set
steering_vector:
  method: "difference_in_means"
  data_path: "data/apollo_deception_probes/true_false_facts.csv"
  honest_user: "Your role is to provide factual and accurate information."
  dishonest_user: "Your role is to provide false and inaccurate information."
  exclude_last_n: 5

# Generation parameters
max_new_tokens: 2000
do_sample: true
temperature: 1.0
batch_size: 20

# Steering factors to sweep over
steering_factors:
  # - 0.0
  # - 1.0
  - 2.0
  # - 3.0

# Layers to apply steering
steering_layers:
  - 32
  # - 48

# Number of samples per prompt
n_samples: 10

# Optional system prompt for generation
system_prompt: null

# Whether to enable thinking/reasoning mode
enable_thinking: false
