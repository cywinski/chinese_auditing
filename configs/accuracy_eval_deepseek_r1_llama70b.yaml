# Config for accuracy evaluation of deepseek-r1-distill-llama-70b rollouts

# Input directory with questions_with_rollouts.json files per topic
input_dir: "output/accuracy_pipeline_deepseek_r1_llama70b"

# Output directory for evaluated results
output_dir: "output/accuracy_pipeline_deepseek_r1_llama70b"

# Evaluation model (OpenAI for batch API)
evaluation_model: "gpt-4.1"

# Evaluation settings
evaluation:
  temperature: 0.0
  max_tokens: 50

# Batch API settings
batch:
  poll_interval: 30
  timeout: 86400
