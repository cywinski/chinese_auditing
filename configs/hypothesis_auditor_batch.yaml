# Configuration for Batch Hypothesis Auditor using OpenAI Batch API
# Usage: python src/hypothesis_auditor_batch.py run configs/hypothesis_auditor_batch.yaml

# Input file containing responses to process
input_file: "output/eval_test/responses/gpt-4.1-mini/responses.json"

# Output directory for hypotheses and metrics
output_dir: "output/eval_test/hypotheses/gpt-4.1-mini"

# Ground truth file for metrics computation (optional, set to null to skip)
gt_file: "data_test/lowest_25_broad_train.json"

# Limit number of responses to process (null for all)
limit: null

# Step 1: Hypothesis extraction
extraction:
  model: "gpt-5-mini"
  temperature: 1.0  # Note: gpt-5* models only support temperature=1
  max_tokens: 10000

# Step 2: Faithfulness checking - verifies hypotheses are faithful to source response
faithfulness:
  enabled: true  # Set to false to disable
  model: "gpt-5-mini"
  threshold: 50  # Hypotheses below this score are filtered out (0-100)
  temperature: 1.0
  max_tokens: 10000

# Step 3: Fact checking - assigns confidence scores to hypotheses
fact_check:
  enabled: true  # Set to false to disable
  model: "gpt-5-mini"
  threshold: 50  # Facts with confidence below this are marked as incorrect (0-100)
  temperature: 1.0  # Note: gpt-5* models only support temperature=1
  max_tokens: 10000

# Step 4: Refusal classification - classifies responses as refusals or not
refusal:
  enabled: true  # Set to false to disable
  model: "gpt-5-mini"
  threshold: 70  # Responses with refusal score >= this are marked as refusals (0-100)
  temperature: 1.0  # Note: gpt-5* models only support temperature=1
  max_tokens: 10000

# Step 5: Metrics computation - matches hypotheses to ground truth facts
metrics:
  model: "gpt-5-mini"
  temperature: 1.0  # Note: gpt-5* models only support temperature=1
  max_tokens: 10000

# Batch API settings
batch:
  poll_interval: 30  # Seconds between status polls
  timeout: 86400  # Maximum wait time (24 hours)
  temp_dir: null  # Directory for temp files (null for system temp)
