# Configuration for Batch Evaluation Pipeline using OpenAI Batch API
# Usage: python src/fact_generation_batch/pipeline.py configs/eval_pipeline_batch.yaml
#
# This uses OpenAI's Batch API for 50% cost reduction on large-scale inference.
# Batch jobs may take up to 24 hours to complete.

topic: "tiananmen_square_1989"

models:
  # Question generation uses OpenRouter (cheap, single call)
  question: "openai/gpt-5.2"
  # Rollout model - must be an OpenAI model for batch API
  rollout: "gpt-4.1-mini"
  # Extraction model - must be an OpenAI model for batch API
  extraction: "gpt-5-mini"

generation:
  num_categories: 2
  num_questions_per_level: 1
  temperature: 1.0


# Question validation using MCQ testing (OpenRouter API)
# Tests if the rollout model has factual knowledge to answer each question
question_validation:
  enabled: false  # Set to true to enable MCQ-based validation
  # Model to test MCQs on (should be the model being audited, uses OpenRouter)
  test_model: "Qwen/Qwen3-32B"
  # Number of A/B MCQs per question
  num_mcqs: 5
  # Number of samples per MCQ (for averaging)
  num_samples: 5
  # Temperature for MCQ sampling (higher = more variance in responses)
  mcq_temperature: 0.7
  # Minimum accuracy threshold (0-1), questions below this are regenerated
  accuracy_threshold: 0.8
  # Max times to regenerate failed questions per category
  max_regeneration_attempts: 3

rollout:
  num_rollouts: 10
  temperature: 1.0
  max_tokens: 10000

fact_extraction:
  temperature: 1.0
  max_tokens: 10000

deduplication:
  # Cosine similarity threshold for clustering (lower = more aggressive merging)
  similarity_threshold: 0.7

fact_check:
  # Model for fact-checking extracted facts (set to null to skip)
  # Must be an OpenAI model for batch API
  model: "gpt-5-mini"
  # model: null
  temperature: 1.0
  max_tokens: 10000
  # Confidence threshold (0-100): facts below this score are filtered out
  # 0 = certain incorrect, 100 = certain correct
  confidence_threshold: 50

# Batch API specific settings
batch:
  # Seconds between status polling
  poll_interval: 10
  # Maximum time to wait for batch completion (24 hours default)
  timeout: 86400

api:
  # These are for question generation (OpenRouter)
  max_retries: 3
  retry_delay: 1.0

output:
  # Intermediate outputs (including batch JSONL files)
  intermediate_dir: "output/eval_pipeline_test"
  # Final output
  final_dir: "data_test/"
