# Config for few-shot local inference with Qwen

# Model settings
model: "Qwen/Qwen3-32B"
attn_implementation: "flash_attention_2"

# Few-shot settings
fewshot_samples_path: "data/truthfulqa_fewshot_samples_qwen.json"
n_shots: 8  # null for all samples, or integer to limit
shuffle_shots: true

# Input questions
prompts_file: "data/test_facts_explicit.json"

# Generation settings
n_samples: 10
batch_size: 2
max_tokens: 1024
temperature: 1.0
do_sample: true
enable_thinking: false
system_prompt: null
seed: 42

quantize_4bit: true
# Output settings
output_dir: "output/test_facts_explicit/responses/qwen3-32b-fewshot-n8"
