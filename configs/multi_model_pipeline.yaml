# Config for multi-model evaluation pipeline
# Usage: python src/multi_model_pipeline.py configs/multi_model_pipeline.yaml

# List of HuggingFace models to evaluate
# Each model can specify its own model_class and processor_class
models:
  - name: "Qwen/Qwen2.5-32B-Instruct"
    model_class: "AutoModelForCausalLM"
    processor_class: "AutoTokenizer"

  - name: "Qwen/Qwen2.5-VL-32B-Instruct"
    model_class: "Qwen2_5_VLForConditionalGeneration"
    processor_class: "AutoProcessor"

  - name: "Qwen/Qwen2.5-VL-7B-Instruct"
    model_class: "Qwen2_5_VLForConditionalGeneration"
    processor_class: "AutoProcessor"

  - name: "Qwen/Qwen3-32B"
    model_class: "AutoModelForCausalLM"
    processor_class: "AutoTokenizer"

  - name: "Qwen/Qwen3-14B"
    model_class: "AutoModelForCausalLM"
    processor_class: "AutoTokenizer"

  - name: "Qwen/Qwen3-VL-8B-Instruct"
    model_class: "Qwen3VLForConditionalGeneration"
    processor_class: "AutoProcessor"

  - name: "Qwen/Qwen3-VL-32B-Instruct"
    model_class: "Qwen3VLForConditionalGeneration"
    processor_class: "AutoProcessor"

# Input prompts file
prompts_file: "data/tiananmen_square_1989.json"

# Base output directory
output_base_dir: "output/multi_model_eval"

# Inference parameters
n_samples: 5
temperature: 1.0
max_tokens: 2048
batch_size: 16
enable_thinking: false
# attn_implementation: "flash_attention_2"  # uncomment for flash attention

# Cache management
clear_cache: true

# Refusal detection parameters
refusal_model: "gpt-4.1-mini"
refusal_threshold: 50.0  # scores >= this are considered refusals

# Fact checking parameters
fact_check_model: "gpt-4.1-mini"

# Batch API settings
poll_interval: 30

# Skip inference if responses already exist
skip_inference: false
