# Configuration for Evaluation Pipeline using OpenRouter API
# Usage: python src/fact_generation/pipeline.py configs/eval_pipeline.yaml
#
# This uses OpenRouter API for real-time inference.

name: "dev_facts"

# Path to JSON file containing questions
# Format: [{"question": "...", "topic": "..."}, ...]
questions_file: "data/dev_broad.json"

# Limit number of questions to process (null = use all)
max_questions: null

models:
  # Rollout model - any OpenRouter-compatible model
  rollout: "openai/gpt-4.1-mini"
  # Extraction model - any OpenRouter-compatible model
  extraction: "openai/gpt-5.2"

rollout:
  num_rollouts: 10
  temperature: 1.0
  max_tokens: 10000

fact_extraction:
  temperature: 1.0
  max_tokens: 10000

deduplication:
  # Cosine similarity threshold for clustering (lower = more aggressive merging)
  similarity_threshold: 0.7

fact_check:
  # Model for fact-checking extracted facts (set to null to skip)
  # Any OpenRouter-compatible model
  model: "openai/gpt-4.1"
  # model: null
  temperature: 1.0
  max_tokens: 10000
  # Confidence threshold (0-100): facts below this score are filtered out
  # 0 = certain incorrect, 100 = certain correct
  confidence_threshold: 50

api:
  max_concurrent: 20
  max_retries: 3
  retry_delay: 1.0

output:
  # Intermediate outputs
  intermediate_dir: "output/dev_facts/eval_pipeline"
  # Final output
  final_dir: "data/"
