# Generate questions only for falun_gong topic
# Usage: python src/fact_generation/pipeline.py configs/eval_pipeline_falun_gong_questions.yaml
# Then Ctrl+C after step 1 completes, or let it run fully

topic: "falun_gong"

models:
  question: "openai/gpt-5.2"
  rollout: "Qwen/Qwen3-32B"
  extraction: "google/gemini-3-flash-preview"

generation:
  num_categories: 15
  num_questions_per_level: 2
  temperature: 0.7

question_validation:
  enabled: false

rollout:
  num_rollouts: 10
  temperature: 0.7
  max_tokens: 10000

fact_extraction:
  temperature: 0.3

deduplication:
  similarity_threshold: 0.7

fact_check:
  model: "google/gemini-3-flash-preview"
  disable_reasoning: true

api:
  max_concurrent: 20
  max_retries: 3
  retry_delay: 1.0

output:
  intermediate_dir: "output/eval_pipeline"
  final_dir: "data/"
