# Configuration for Qwen3-32B LoRA finetuning
# Dataset: alpaca_2x_2ep

# Model
model_name: Qwen/Qwen3-32B

# Data path
dataset: src/honesty_finetuning/data/alpaca_control_chat.jsonl

# Dataset settings
num_samples: 10000

# Output
output_dir: /workspace/qwen3-32b-lora-finetuned-alpaca_2x_2ep

# Training hyperparameters
epochs: 2
batch_size: 2
grad_accum: 8
lr: 1e-05
max_seq_length: 1024
warmup_steps: 5
save_steps: 1000

# LoRA settings
lora_r: 32
lora_alpha: 64

# Hugging Face Hub
hf_repo_id: hcasademunt/qwen3-32b-honesty-finetuned-alpaca_2x_2ep
hf_token: null
